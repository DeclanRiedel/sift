[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Transitive through tiberius 0.12.3 -> tokio-rustls 0.24/rustls 0.21.
  # tiberius 0.12.3 is the latest published tiberius release currently in use.
  # Remove these once the SQL Server driver can move to a tiberius release on
  # rustls-webpki >= 0.103.13 / rustls-pki-types PEM parsing.
  "RUSTSEC-2025-0134",
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",
  # Target-specific transitive through Loro -> postcard -> heapless 0.7.
  # `atomic-polyfill` is archived, but it is not selected on Sift's supported
  # server targets and the advisory reports no vulnerability or safe upgrade.
  # Remove when Loro's postcard chain moves to heapless >= 0.8.
  "RUSTSEC-2023-0089",
  # Transitive through the latest Loro 1.13.9 -> loro-internal -> im. These
  # advisories report maintenance status, not a vulnerability, and no Loro
  # release has moved to the maintained imbl fork yet. Keep the exception
  # limited to the three exact packages and remove it with that upstream move.
  "RUSTSEC-2026-0247", # bitmaps
  "RUSTSEC-2026-0248", # im
  "RUSTSEC-2026-0251", # sized-chunks
  # Transitive through the exact GPUI/Zed pin. These are maintenance-status
  # advisories without a patched release in that revision. Re-audit and remove
  # them whenever the GPUI pin advances.
  "RUSTSEC-2024-0436", # paste
  "RUSTSEC-2026-0206", # rustybuzz
  "RUSTSEC-2026-0192", # ttf-parser
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "bzip2-1.0.6",
]
exceptions = [
  # GPUI depends directly on Zed's GPL tracing support. Sift is AGPL-3.0-only,
  # so this is compatible; keep the exception constrained to the exact crates.
  { allow = ["GPL-3.0-or-later"], crate = "zlog" },
  { allow = ["GPL-3.0-or-later"], crate = "ztracing" },
  { allow = ["GPL-3.0-or-later"], crate = "ztracing_macro" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  # Exact revisions are locked in Cargo.lock and reviewed when the GPUI pin is
  # advanced. These are GPUI itself and its upstream git dependencies.
  "https://github.com/proptest-rs/proptest",
  "https://github.com/zed-industries/font-kit",
  "https://github.com/zed-industries/wasm_thread",
  "https://github.com/zed-industries/xim-rs.git",
  "https://github.com/zed-industries/zed.git",
]
