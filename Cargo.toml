[workspace]
resolver = "2"
members = [
    "crates/instance-config",
    "crates/protocol",
    "crates/api-types",
    "crates/extension-protocol",
    "crates/plugin-host",
    "crates/core",
    "crates/driver-api",
    "crates/driver-postgres",
    "crates/driver-sqlserver",
    "crates/metadata",
    "crates/doc",
    "crates/semantic",
    "crates/completion",
    "crates/server",
    "crates/client-sdk",
    "crates/ui",
    "crates/workspace-ui",
    "crates/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "AGPL-3.0-only"
repository = "https://github.com/declan/sift"

[workspace.dependencies]
# Internal crates
sift-protocol = { path = "crates/protocol", version = "0.1.0" }
sift-instance-config = { path = "crates/instance-config", version = "0.1.0" }
sift-api-types = { path = "crates/api-types", version = "0.1.0" }
sift-extension-protocol = { path = "crates/extension-protocol", version = "0.1.0" }
sift-plugin-host = { path = "crates/plugin-host", version = "0.1.0" }
sift-core = { path = "crates/core", version = "0.1.0" }
sift-driver-api = { path = "crates/driver-api", version = "0.1.0" }
sift-driver-postgres = { path = "crates/driver-postgres", version = "0.1.0" }
sift-driver-sqlserver = { path = "crates/driver-sqlserver", version = "0.1.0" }
sift-metadata = { path = "crates/metadata", version = "0.1.0" }
sift-doc = { path = "crates/doc", version = "0.1.0" }
sift-semantic = { path = "crates/semantic", version = "0.1.0" }
sift-completion = { path = "crates/completion", version = "0.1.0" }
sift-server = { path = "crates/server", version = "0.1.0" }
sift-client-sdk = { path = "crates/client-sdk", version = "0.1.0" }
sift-ui = { path = "crates/ui", version = "0.1.0" }
sift-workspace-ui = { path = "crates/workspace-ui", version = "0.1.0" }

# External
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonschema = { version = "0.49.1", default-features = false }
roxmltree = "0.20"
schemars = { version = "0.8", features = ["chrono", "uuid1"] }
thiserror = "1.0"
anyhow = "1.0"
arc-swap = "1"
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
chrono-tz = "0.10.4"
csv = "1.3"
serde_bytes = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
refinery = { version = "0.8", features = ["rusqlite"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
rpassword = "7"
base64 = "0.22"
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
sha2 = "0.10"
unicode-normalization = "0.1"
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
getrandom = "0.2"
tempfile = "3"
# Pure-Rust backends only: apple/windows native, and a zbus-based Secret
# Service on Linux/BSD (async-secret-service + crypto-rust + async-io) so there
# is no libdbus/system C dependency to build against.
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "async-secret-service",
  "crypto-rust",
  "async-io",
] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
deadpool-postgres = "0.14"
axum = { version = "0.7", default-features = false, features = ["form", "http1", "json", "matched-path", "original-uri", "query", "tokio", "tower-log", "tracing", "ws"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["trace", "cors", "normalize-path", "compression-gzip", "compression-br"] }
figment = { version = "0.10", default-features = false, features = ["toml", "env"] }
fs2 = "0.4"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = "1"
toml = "0.8"
url = "2"
zip = { version = "2", default-features = false, features = ["aes-crypto", "deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73", "chrono"] }
tokio-postgres-rustls = { version = "0.14", features = ["native-certs", "ring"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
sqlparser = { version = "0.52", default-features = false }
loro = "=1.13.9"
libc = "0.2"
unicode-segmentation = "1"

# Phase M pins GPUI exactly because the framework remains pre-1.0. Upgrades are
# deliberate compatibility commits, never an unconstrained crates.io update.
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed.git", rev = "d71f1461045c098dc6ca6b1b5adcf1b8949722e8", default-features = false, features = ["wayland", "x11"] }
gpui_platform = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", rev = "d71f1461045c098dc6ca6b1b5adcf1b8949722e8", default-features = false, features = ["font-kit", "wayland", "x11"] }

[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
lto = "thin"
codegen-units = 1
