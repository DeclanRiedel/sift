version = 1
name = "Sift Ayu Dark"
appearance = "dark"

# Ayu Dark's cool near-black surfaces and warm syntax palette, with a slightly
# darker editor background for Sift's data-dense workspace.
[colors]
background = "#070b10"
surface = "#0a0e14"
panel = "#0d1219"
toolbar = "#090d13"
elevated_surface = "#111821"
hovered_surface = "#ffffff0a"
selected_surface = "#59c2ff18"
active_surface = "#59c2ff24"
scrim = "#00000073"
border = "#1b2530"
subtle_border = "#141c25"
strong_border = "#33404d"
text = "#b3b1ad"
muted_text = "#737a82"
disabled_text = "#4d5560"
accent = "#e6b450"
accent_muted = "#e6b45024"
accent_hover = "#ffcc66"
drop_target_background = "#59c2ff20"
drop_target_border = "#59c2ff"
on_accent = "#070b10"
focus_ring = "#e6b450"
danger = "#f07178"
danger_muted = "#f0717824"
warning = "#ffb454"
warning_muted = "#ffb45424"
success = "#aad94c"
success_muted = "#aad94c20"
editor_active_line = "#ffffff08"
grid_stripe = "#ffffff05"
syntax_keyword = "#ff8f40"
