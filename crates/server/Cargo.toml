[package]
name = "sift-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sift-protocol = { workspace = true }
sift-core = { workspace = true }
sift-driver-api = { workspace = true, features = ["mock"] }
sift-driver-postgres = { workspace = true }
sift-driver-sqlserver = { workspace = true }
sift-doc = { workspace = true }
sift-completion = { workspace = true }
sift-client-sdk = { workspace = true }
sift-metadata = { workspace = true }
anyhow = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
async-stream = "0.3"
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
chacha20poly1305 = { workspace = true }
csv = { workspace = true }
ed25519-dalek = { workspace = true }
dashmap = { workspace = true }
figment = { workspace = true }
fs2 = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
roxmltree = { workspace = true }
rpassword = { workspace = true }
rand_core = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
sqlparser = { workspace = true, features = ["std", "visitor"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
aide = { version = "=0.13.5", features = ["axum", "axum-ws", "macros"] }

[features]
# Forwards to sift-metadata: enables the OS keychain secret backend (pure-Rust,
# no system libdbus). Off by default — it needs a running credential service at
# runtime, which headless CI lacks.
os-keychain = ["sift-metadata/os-keychain"]
# Enables the 1M-row bounded-memory stress test in api_smoke. Slow
# (~10s+) so off by default; run manually or in nightly CI.
stress-1m = []
# Enables live-PG integration tests that require a running Postgres
# (ddl_round_trip). Off by default so `cargo test` in a bare devshell
# stays green; local invocation follows the same instructions as
# `sift-driver-postgres --features live-pg`.
live-pg = []

[dev-dependencies]
sift-driver-api = { workspace = true, features = ["mock"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-tungstenite = { workspace = true }
tower = { workspace = true, features = ["util"] }

[[bin]]
name = "sift-server"
path = "src/main.rs"

[[bin]]
name = "sift-admin"
path = "src/bin/sift-admin.rs"

[[bin]]
name = "sift-remote"
path = "src/bin/sift-remote.rs"

[[bin]]
name = "sift-launcher"
path = "src/bin/sift-launcher.rs"
