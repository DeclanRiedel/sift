[package]
name = "sift-server"
default-run = "sift-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
percent-encoding = { workspace = true }
sift-api-types = { workspace = true }
sift-instance-config = { workspace = true }
sift-protocol = { workspace = true }
sift-core = { workspace = true }
sift-sql-variables = { workspace = true }
sift-snippets = { workspace = true }
sift-driver-api = { workspace = true, features = ["mock"] }
sift-driver-postgres = { workspace = true }
sift-driver-sqlite = { workspace = true }
sift-driver-sqlserver = { workspace = true }
sift-extension-protocol = { workspace = true }
sift-plugin-host = { workspace = true }
sift-doc = { workspace = true }
sift-semantic = { workspace = true }
sift-completion = { workspace = true }
sift-client-sdk = { workspace = true }
sift-metadata = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arc-swap = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
async-stream = "0.3"
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
cap-std = { workspace = true }
cap-fs-ext = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
chacha20poly1305 = { workspace = true }
csv = { workspace = true }
ed25519-dalek = { workspace = true }
dashmap = { workspace = true }
figment = { workspace = true }
fs2 = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
jsonschema = { workspace = true }
parquet = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
roxmltree = { workspace = true }
rpassword = { workspace = true }
rusqlite = { workspace = true }
rand_core = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
sqlparser = { workspace = true, features = ["std", "visitor"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
zip = { workspace = true }
zeroize = "1"
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
aide = { version = "=0.13.5", features = ["axum", "axum-ws", "macros"] }

[features]
# Requires a running platform credential service, absent in headless CI.
os-keychain = ["sift-metadata/os-keychain"]
# The million-page stress test is opt-in to keep ordinary test runs bounded.
stress-1m = []
# Requires disposable native PostgreSQL; see docs/DEVELOPMENT.md.
live-pg = []
live-mssql = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
sift-driver-api = { workspace = true, features = ["mock"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-tungstenite = { workspace = true }
tower = { workspace = true, features = ["util"] }

[[bin]]
name = "sift-server"
path = "src/main.rs"

[[bin]]
name = "sift-admin"
path = "src/bin/sift-admin.rs"

[[bin]]
name = "sift-remote"
path = "src/bin/sift-remote.rs"

[[bin]]
name = "sift-launcher"
path = "src/bin/sift-launcher.rs"

[[bin]]
name = "sift"
path = "src/bin/sift.rs"
