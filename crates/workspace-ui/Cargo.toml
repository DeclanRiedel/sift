[package]
name = "sift-workspace-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
benchmark = []

[dependencies]
chrono = { workspace = true }
csv = { workspace = true }
gpui = { workspace = true }
modalkit = { workspace = true }
percent-encoding = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sift-api-types = { workspace = true }
sift-client-sdk = { workspace = true }
sift-completion = { workspace = true }
sift-doc = { workspace = true }
sift-instance-config = { workspace = true }
sift-protocol = { workspace = true }
sift-sql-variables = { workspace = true }
sift-snippets = { workspace = true }
sift-ui = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
url = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
gpui = { workspace = true, features = ["bench", "test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[[bench]]
name = "frame_budget"
harness = false
required-features = ["benchmark"]
