# Workspace build resource limits.
#
# Committed and portable: nothing here assumes Nix, a specific linker, or a
# specific machine. Toolchain-specific accelerators (sccache, mold) are set by
# the Nix dev shell in flake.nix, which can guarantee those binaries exist.
#
# Why: a full `cargo build` of this workspace links GPUI plus the server and
# both drivers. Left uncapped, cargo saturates every core and peak RSS during
# codegen/link starves the desktop session it is supposed to be developing.

[build]
# Negative values mean "all logical cores minus N". Leaves headroom for the
# editor, rust-analyzer, a running sift-server, and a Postgres instance.
jobs = -6

[future-incompat-report]
frequency = "never"

[net]
# Fewer parallel git/registry fetches; the crates.io + zed git dependency
# fetches otherwise burst hard on a cold cache.
retry = 3
