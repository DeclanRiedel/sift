<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Sift · GitHub authorization</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="sift.ico" type="image/x-icon" />
  <script src="/authorized.js" defer></script>
</head>
<body class="authorization-page">
  <main>
    <section class="authorization-card" aria-labelledby="authorization-title">
      <div class="authorization-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path id="authorization-symbol" d="m5 12 4 4 10-10" />
        </svg>
      </div>
      <p class="authorization-brand">Sift</p>
      <h1 id="authorization-title">You can return to Sift</h1>
      <p id="authorization-message">Finish signing in in the Sift desktop app. You can close this tab.</p>
      <a class="authorization-home" href="/">Back to the Sift website</a>
    </section>
  </main>
</body>
</html>
